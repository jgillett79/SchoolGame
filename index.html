<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a6fbf 0%, #0d4a8a 50%, #082d5e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    .page.active {
      display: flex;
    }

    .title {
      color: #ffffff;
      font-size: 3rem;
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
      text-align: center;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .category-btn {
      width: 200px;
      height: 120px;
      border: none;
      border-radius: 18px;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      color: #ffffff;
    }

    .category-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .category-btn:active {
      transform: translateY(1px) scale(0.98);
      filter: brightness(0.9);
    }

    /* Main menu colours */
    .btn-math      { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-inquiry   { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-literacy  { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-wellbeing { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    /* Math sub-menu colours */
    .btn-addition       { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-subtraction    { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-multiplication { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-division       { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    /* Addition sub-menu colours */
    .btn-numbersplash  { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-speedmath     { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-friendsoften  { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-addone        { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    /* Inquiry sub-menu colours */
    .btn-animal    { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-qa        { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-landscape { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-world     { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    /* Literacy sub-menu colours */
    .btn-sentence    { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-paragraphs  { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-punctuation { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-text        { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    /* Wellbeing sub-menu colours */
    .btn-emotions       { background: linear-gradient(135deg, #e84393, #c0166f); }
    .btn-friends        { background: linear-gradient(135deg, #f4a020, #d07a00); }
    .btn-bodylanguage   { background: linear-gradient(135deg, #27c47a, #159552); }
    .btn-handleemotions { background: linear-gradient(135deg, #a855f7, #7c22d4); }

    .back-btn {
      padding: 14px 36px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Subject page (non-math) */
    #subject-page {
      color: #ffffff;
      gap: 32px;
    }

    .subject-title {
      font-size: 2.8rem;
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
    }

    .subject-description {
      font-size: 1.1rem;
      color: #b8d9f7;
      max-width: 420px;
      text-align: center;
      line-height: 1.7;
    }

    .subject-icon { font-size: 5rem; }

    /* ── Add One game ── */
    .game-page {
      color: #ffffff;
      gap: 28px;
      text-align: center;
    }

    .game-level {
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(0,0,0,0.4);
      letter-spacing: 2px;
    }

    .stopwatch {
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 10px 32px;
      letter-spacing: 2px;
    }

    .game-question {
      font-size: 2.6rem;
      font-weight: 700;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 32px 48px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .answer-input {
      width: 320px;
      padding: 16px 20px;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      border: 3px solid rgba(255,255,255,0.5);
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .answer-input::placeholder { color: rgba(255,255,255,0.45); }

    .answer-input:focus {
      border-color: #ffffff;
      background: rgba(255,255,255,0.25);
    }

    .check-btn {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #27c47a, #159552);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .check-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .check-btn:active { transform: translateY(1px); }

    .feedback {
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 1.6em;
    }

    .feedback.correct { color: #7aff9e; }
    .feedback.wrong   { color: #ff7a7a; }

    /* ── Results page ── */
    #addone-results {
      color: #ffffff;
      gap: 32px;
      text-align: center;
    }

    .results-heading {
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(0,0,0,0.4);
    }

    .results-time {
      font-size: 2.8rem;
      font-weight: 700;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 20px 48px;
    }

    .results-time span { color: #7aff9e; }

    .leaderboard {
      background: rgba(0,0,0,0.2);
      border-radius: 18px;
      padding: 24px 40px;
      min-width: 320px;
    }

    .leaderboard h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #b8d9f7;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .leaderboard-row:last-child { border-bottom: none; }

    .rank { font-size: 1.5rem; margin-right: 12px; }

    .play-again-btn {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #e84393, #c0166f);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .play-again-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .play-again-btn:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <!-- Front Page -->
  <div id="front-page" class="page active">
    <h1 class="title">School Game</h1>
    <div class="button-grid">
      <button class="category-btn btn-math"      onclick="showPage('math-page')">Math</button>
      <button class="category-btn btn-inquiry"   onclick="showPage('inquiry-page')">Inquiry</button>
      <button class="category-btn btn-literacy"  onclick="showPage('literacy-page')">Literacy</button>
      <button class="category-btn btn-wellbeing" onclick="showPage('wellbeing-page')">Wellbeing</button>
    </div>
  </div>

  <!-- Wellbeing Sub-Menu -->
  <div id="wellbeing-page" class="page">
    <h1 class="title">Wellbeing</h1>
    <div class="button-grid">
      <button class="category-btn btn-emotions"       onclick="alert('Emotions coming soon!')">Emotions</button>
      <button class="category-btn btn-friends"        onclick="alert('Friends coming soon!')">Friends</button>
      <button class="category-btn btn-bodylanguage"   onclick="alert('Body language coming soon!')">Body language</button>
      <button class="category-btn btn-handleemotions" onclick="alert('How to handle emotions coming soon!')">How to handle emotions</button>
    </div>
    <button class="back-btn" onclick="showPage('front-page')">&#8592; Back to Menu</button>
  </div>

  <!-- Literacy Sub-Menu -->
  <div id="literacy-page" class="page">
    <h1 class="title">Literacy</h1>
    <div class="button-grid">
      <button class="category-btn btn-sentence"    onclick="alert('Sentence structure coming soon!')">Sentence structure</button>
      <button class="category-btn btn-paragraphs"  onclick="alert('Paragraphs coming soon!')">Paragraphs</button>
      <button class="category-btn btn-punctuation" onclick="alert('Punctuation coming soon!')">Punctuation</button>
      <button class="category-btn btn-text"        onclick="alert('Text coming soon!')">Text</button>
    </div>
    <button class="back-btn" onclick="showPage('front-page')">&#8592; Back to Menu</button>
  </div>

  <!-- Inquiry Sub-Menu -->
  <div id="inquiry-page" class="page">
    <h1 class="title">Inquiry</h1>
    <div class="button-grid">
      <button class="category-btn btn-animal"    onclick="alert('Animal fact file coming soon!')">Animal fact file</button>
      <button class="category-btn btn-qa"        onclick="alert('Q&amp;A coming soon!')">Q&amp;A</button>
      <button class="category-btn btn-landscape" onclick="alert('Landscape fact file coming soon!')">Landscape fact file</button>
      <button class="category-btn btn-world"     onclick="alert('How the world works coming soon!')">How the world works</button>
    </div>
    <button class="back-btn" onclick="showPage('front-page')">&#8592; Back to Menu</button>
  </div>

  <!-- Add One Game -->
  <div id="addone-page" class="page game-page">
    <div class="game-level" id="addone-level">Add 1 &mdash; Level 1</div>
    <div class="stopwatch" id="addone-timer">00:00.0</div>
    <div class="game-question" id="addone-question">11 + 1 = ?</div>
    <div class="answer-area">
      <input class="answer-input" id="addone-input" type="text" placeholder="Type your answer..."
             onkeydown="if(event.key==='Enter') checkAddOne()" />
      <button class="check-btn" onclick="checkAddOne()">Check Answer</button>
      <div class="feedback" id="addone-feedback"></div>
    </div>
    <button class="back-btn" onclick="resetAddOne(); showPage('addition-page')">&#8592; Back to Addition</button>
  </div>

  <!-- Add One Results -->
  <div id="addone-results" class="page">
    <div class="results-heading">Did you beat your high score?</div>
    <div class="results-time">Your time: <span id="result-time-display"></span></div>
    <div class="leaderboard">
      <h3>Top 3 Best Times</h3>
      <div id="leaderboard-rows"></div>
    </div>
    <button class="play-again-btn" onclick="startAddOne()">Play Again</button>
    <button class="back-btn" onclick="showPage('addition-page')">&#8592; Back to Addition</button>
  </div>

  <!-- Addition Sub-Menu -->
  <div id="addition-page" class="page">
    <h1 class="title">Addition</h1>
    <div class="button-grid">
      <button class="category-btn btn-numbersplash" onclick="alert('Number splash coming soon!')">Number splash</button>
      <button class="category-btn btn-speedmath"    onclick="alert('Speed math coming soon!')">Speed math</button>
      <button class="category-btn btn-friendsoften" onclick="alert('Friends of ten coming soon!')">Friends of ten</button>
      <button class="category-btn btn-addone"       onclick="startAddOne()">Add one</button>
    </div>
    <button class="back-btn" onclick="showPage('math-page')">&#8592; Back to Math</button>
  </div>

  <!-- Math Sub-Menu -->
  <div id="math-page" class="page">
    <h1 class="title">Math</h1>
    <div class="button-grid">
      <button class="category-btn btn-addition"       onclick="showPage('addition-page')">Addition</button>
      <button class="category-btn btn-subtraction"    onclick="alert('Subtraction coming soon!')">Subtraction</button>
      <button class="category-btn btn-multiplication" onclick="alert('Multiplication coming soon!')">Multiplication</button>
      <button class="category-btn btn-division"       onclick="alert('Division coming soon!')">Division</button>
    </div>
    <button class="back-btn" onclick="showPage('front-page')">&#8592; Back to Menu</button>
  </div>

  <!-- Other Subject Page -->
  <div id="subject-page" class="page">
    <div class="subject-icon" id="subject-icon"></div>
    <h2 class="subject-title" id="subject-title"></h2>
    <p class="subject-description" id="subject-description"></p>
    <button class="back-btn" onclick="showPage('front-page')">&#8592; Back to Menu</button>
  </div>

  <script>
    const subjects = {
      Inquiry: {
        icon: '🔍',
        description: 'Ask big questions, explore the world around you, and discover how things work through investigation!'
      },
      Literacy: {
        icon: '📚',
        description: 'Read, write, and communicate — build your vocabulary and express your ideas with confidence!'
      },
      Wellbeing: {
        icon: '🌟',
        description: 'Take care of your mind and body. Learn about healthy habits, emotions, and how to feel your best!'
      }
    };

    const addOneLevels = [
      { level: 1,  question: '11 + 1 = ?',           answer: '12' },
      { level: 2,  question: '123 + 1 = ?',          answer: '124' },
      { level: 3,  question: '1029 + 1 = ?',         answer: '1030' },
      { level: 4,  question: '18257 + 1 = ?',        answer: '18258' },
      { level: 5,  question: '28754 + 1 = ?',        answer: '28755' },
      { level: 6,  question: '3946547 + 1 = ?',      answer: '3946548' },
      { level: 7,  question: '19347497 + 1 = ?',     answer: '19347498' },
      { level: 8,  question: '904653954 + 1 = ?',    answer: '904653955' },
      { level: 9,  question: '1234567809 + 1 = ?',   answer: '1234567810' },
      { level: 10, question: '10293847562 + 1 = ?',  answer: '10293847563' }
    ];

    let currentAddOneLevel = 0;
    let timerInterval = null;
    let timerStart = null;
    let elapsedMs = 0;

    function formatTime(ms) {
      const totalTenths = Math.floor(ms / 100);
      const tenths = totalTenths % 10;
      const totalSecs = Math.floor(ms / 1000);
      const secs = totalSecs % 60;
      const mins = Math.floor(totalSecs / 60);
      return (mins < 10 ? '0' : '') + mins + ':' +
             (secs < 10 ? '0' : '') + secs + '.' + tenths;
    }

    function startTimer() {
      timerStart = Date.now();
      timerInterval = setInterval(() => {
        elapsedMs = Date.now() - timerStart;
        document.getElementById('addone-timer').textContent = formatTime(elapsedMs);
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      elapsedMs = Date.now() - timerStart;
    }

    function startAddOne() {
      currentAddOneLevel = 0;
      elapsedMs = 0;
      document.getElementById('addone-timer').textContent = '00:00.0';
      loadAddOneLevel(0);
      showPage('addone-page');
      document.getElementById('addone-input').focus();
      startTimer();
    }

    function loadAddOneLevel(index) {
      const data = addOneLevels[index];
      document.getElementById('addone-level').textContent = 'Add 1 — Level ' + data.level;
      document.getElementById('addone-question').textContent = data.question;
      document.getElementById('addone-input').value = '';
      document.getElementById('addone-feedback').textContent = '';
      document.getElementById('addone-feedback').className = 'feedback';
    }

    function checkAddOne() {
      const input = document.getElementById('addone-input');
      const feedback = document.getElementById('addone-feedback');
      const correct = addOneLevels[currentAddOneLevel].answer;

      if (input.value.trim() === correct) {
        const nextIndex = currentAddOneLevel + 1;
        if (nextIndex < addOneLevels.length) {
          feedback.textContent = '✅ Correct! Loading next level...';
          feedback.className = 'feedback correct';
          setTimeout(() => {
            currentAddOneLevel = nextIndex;
            loadAddOneLevel(currentAddOneLevel);
            document.getElementById('addone-input').focus();
          }, 800);
        } else {
          stopTimer();
          setTimeout(() => showResults(elapsedMs), 800);
        }
      } else {
        feedback.textContent = '❌ Not quite — try again!';
        feedback.className = 'feedback wrong';
      }
    }

    function showResults(ms) {
      const scores = JSON.parse(localStorage.getItem('addone_scores') || '[]');
      scores.push(ms);
      scores.sort((a, b) => a - b);
      const top3 = scores.slice(0, 3);
      localStorage.setItem('addone_scores', JSON.stringify(scores));

      document.getElementById('result-time-display').textContent = formatTime(ms);

      const medals = ['🥇', '🥈', '🥉'];
      const rows = top3.map((t, i) =>
        `<div class="leaderboard-row">
           <span><span class="rank">${medals[i]}</span> #${i + 1}</span>
           <span>${formatTime(t)}</span>
         </div>`
      ).join('');
      document.getElementById('leaderboard-rows').innerHTML = rows;

      showPage('addone-results');
    }

    function resetAddOne() {
      clearInterval(timerInterval);
      timerInterval = null;
      currentAddOneLevel = 0;
      elapsedMs = 0;
      document.getElementById('addone-timer').textContent = '00:00.0';
      loadAddOneLevel(0);
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function openSubject(name) {
      const data = subjects[name];
      document.getElementById('subject-icon').textContent = data.icon;
      document.getElementById('subject-title').textContent = name;
      document.getElementById('subject-description').textContent = data.description;
      showPage('subject-page');
    }
  </script>

</body>
</html>
